<!DOCTYPE html>
<html>
<head>
  <title>Pizza Shop 2.0</title>
</head>
<body>
  <form>
    <table border="1" cellpadding="5">
      <tr>
        <th colspan="2"><b>Pizza Shop 2.0</b></th>
      </tr>
      <tr>
        <td>Name</td>
        <td><input type="text" name="name" /></td>
      </tr>
      <tr>
        <td>Pizza Topping</td>
        <td>
          <input type="radio" name="topping" value="supreme" /> Supreme<br />
          <input type="radio" name="topping" value="vegetarian" /> Vegetarian<br />
          <input type="radio" name="topping" value="hawaiian" /> Hawaiian
        </td>
      </tr>
      <tr>
        <td>Pizza Sauce</td>
        <td>
          <select name="sauce">
            <option value="tomato">Tomato</option>
            <option value="bbq">BBQ</option>
            <option value="pesto">Pesto</option>
          </select>
        </td>
      </tr>
      <tr>
        <td>Optional Extras</td>
        <td>
          <input type="checkbox" name="extras" value="cheese" /> Extra Cheese
          <input type="checkbox" name="extras" value="glutenfree" /> Gluten Free Base
        </td>
      </tr>
      <tr>
        <td colspan="2">Delivery Instructions:<br />
          <textarea name="instructions" rows="5" cols="50"></textarea>
        </td>
      </tr>
      <tr>
        <td colspan="2" Align="left">
          <input type="submit" value="Send my Order" />
        </td>
      </tr>
    </table>
  </form>
</body>
</html>
