<!DOCTYPE html>
<html>
<head>
  <title>Nested List and Definition List</title>
  <style>
    Body {
      Font-family: Arial, sans-serif;
      Margin: 20px;
    }
    H2 {
      Text-align: center;
    }
    Hr {
      Width: 100%;
    }
    .list-section {
      Margin-left: 40px;
      Margin-top: 20px;
    }
  </style>
</head>
<body>

  <h2>To illustrate Nested and Definition List Tags</h2>
  <hr>

  <div class="list-section">
    <p><strong>An ordered nested List:</strong></p>
    <ol>
      <li>Coffee</li>
      <li>Tea
        <ol type="a">
          <li>Black tea</li>
          <li>Green tea
            <ol type="i">
              <li>China</li>
              <li>Africa</li>
            </ol>
          </li>
        </ol>
      </li>
      <li>Milk</li>
    </ol>
  </div>

  <div class="list-section">
    <p><strong>A Definition List:</strong></p>
    <dl>
      <dt>Bangalore</dt>
      <dd>- Capital City of Karnataka</dd>

      <dt>Mumbai</dt>
      <dd>- Capital City of Maharashtra</dd>
    </dl>
  </div>

</body>
</html>
