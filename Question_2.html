<!DOCTYPE html>
<html>
<head>
  <title>Text Formatting Tags</title>
  <style>
    Body {
      Text-align: center;
      Font-family: Arial, sans-serif;
    }
    Hr {
      Width: 100%;
    }
    .content {
      Margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>To illustrate text formatting tags</h1>
  <hr>

  <marquee behavior=”alternate”>This is an alternate Marquee text</marquee>

  <div class=”content”>
    <p>This is <i>italicized</i></p>
    <p>This is <u>underlined</u></p>
    <p>This is <b>bold</b></p>
    <p>This is <em>emphasized</em></p>
    <p>This is <strong>Strong Text</strong></p>
    <p>This is <s>striked text</s></p>
    <p>This is <code>computer code</code></p>
    <p>This is <sup>superscript</sup> code</p>
    <p>This is <sub>subscript</sub> code</p>
    <p>This is <big>big text</big></p>
    <p>This is <small>small text</small></p>
  </div>

</body>
</html>
