<!DOCTYPE html>
<html>
<head>
  <title>HTML Table</title>
  <style>
    Table {
      Border-collapse: collapse;
      Width: 80%;
      Margin: 20px auto;
    }
    Th, td {
      Border: 2px solid #555;
      Padding: 10px;
      Text-align: center;
    }
    .gray-background {
      Background-color: gray;
      Color: black;
      font-family: Georgia, 'Times New Roman', Times, serif;
    }
  </style>
</head>
<body>

  <table>
    <tr>
      <th colspan="4">Table Heading Cell Spanning 4 Columns</th>
    </tr>
    <tr>
      <td>Normal cell</td>
      <td colspan="2">Cell spanning 2 columns</td>
      <td>Normal cell</td>
    </tr>
    <tr>
      <td rowspan="3" class="gray-background">
        Cell spanning 3 rows with a gray<br>(US spelling)<br>background
      </td>
      <td>Normal cell</td>
      <td>Normal cell</td>
      <td>Normal cell</td>
    </tr>
    <tr>
      <td>Normal cell</td>
      <td colspan="2" rowspan="2">Cell spanning 2 rows and 2 columns</td>
    </tr>
    <tr>
      <td>Normal cell</td>
    </tr>
  </table>

</body>
</html>
